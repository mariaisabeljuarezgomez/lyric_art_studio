<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lyric Art Studio</title>
    <meta name="description" content="Create your Lyric Art Studio account to start collecting and purchasing music lyric designs.">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/tailwind.css">

</head>
<body class="bg-white min-h-screen">
    <div class="w-full max-w-xs mx-auto px-4">
        <div class="w-full max-w-xs mx-auto bg-white rounded-lg shadow-xl p-6 border border-gray-200" style="max-width: 320px; width: 100%;">
            <!-- Logo -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Lyric Art Studio</h1>
                <p class="text-gray-600 mt-1">Create your account</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"
                           placeholder="Enter your full name">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"
                           placeholder="Enter your email">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"
                           placeholder="Create a password">
                    <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters</p>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"
                           placeholder="Confirm your password">
                </div>

                <div class="flex items-start">
                    <input type="checkbox" id="terms" required class="mt-1 rounded border-gray-300 text-accent focus:ring-accent">
                    <label for="terms" class="ml-2 text-sm text-gray-600">
                        I agree to the 
                        <a href="/terms" class="text-accent hover:text-accent-dark">Terms of Service</a> 
                        and 
                        <a href="/privacy" class="text-accent hover:text-accent-dark">Privacy Policy</a>
                    </label>
                </div>

                <div class="flex items-start">
                    <input type="checkbox" id="newsletter" class="mt-1 rounded border-gray-300 text-accent focus:ring-accent">
                    <label for="newsletter" class="ml-2 text-sm text-gray-600">
                        Subscribe to our newsletter for updates and new designs
                    </label>
                </div>

                <button type="submit" 
                        class="w-full bg-accent text-white py-2 px-4 rounded-lg hover:bg-accent-dark transition-colors duration-200 font-medium">
                    Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="my-4 flex items-center">
                <div class="flex-1 border-t border-gray-300"></div>
                <span class="px-4 text-gray-500 text-sm">or</span>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>

            <!-- Social Registration -->
            <div class="space-y-2">
                <button type="button" onclick="signInWithGoogle()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-200 font-medium flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign up with Google
                </button>
                <button type="button" onclick="signInWithGitHub()" class="w-full bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-900 transition-colors duration-200 font-medium flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    Sign up with GitHub
                </button>
            </div>

            <!-- Login Link -->
            <div class="text-center mt-6">
                <p class="text-gray-600">
                    Already have an account? 
                    <a href="/login" class="text-accent hover:text-accent-dark font-medium">Sign in</a>
                </p>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-4">
                <a href="/" class="text-gray-500 hover:text-gray-700 text-sm">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50"></div>

    <script>
        console.log('🔐 Registration form script loaded');
        
        // Registration functionality
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('📝 Form submitted');
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            console.log('📧 Form data:', { name, email, password: '***', confirmPassword: '***' });
            
            // Validation
            if (password !== confirmPassword) {
                console.log('❌ Passwords do not match');
                showNotification('Passwords do not match', 'error');
                return;
            }
            
            if (password.length < 8) {
                console.log('❌ Password too short');
                showNotification('Password must be at least 8 characters', 'error');
                return;
            }
            
            console.log('✅ Validation passed, making API call...');
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', Object.fromEntries(response.headers.entries()));
                
                const responseText = await response.text();
                console.log('📊 Response body:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error('❌ Response is not JSON:', responseText);
                    showNotification('Server returned invalid response', 'error');
                    return;
                }
                
                if (data.success) {
                    console.log('✅ Registration successful!');
                    showNotification('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    console.log('❌ Registration failed:', data.error);
                    showNotification(data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('💥 Network error:', error);
                showNotification('Network error. Please try again.', 'error');
            }
        });

        function showNotification(message, type = 'info') {
            console.log('🔔 Showing notification:', message, type);
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 z-50 ${
                type === 'success' ? 'bg-green-500 text-white' : 
                type === 'error' ? 'bg-red-500 text-white' : 
                'bg-blue-500 text-white'
            }`;
            
            notification.classList.remove('opacity-0');
            
            setTimeout(() => {
                notification.classList.add('opacity-0');
            }, 3000);
        }
        
        console.log('✅ Registration form script initialized');
        
        // OAuth Functions
        function signInWithGoogle() {
            console.log('🔐 Initiating Google OAuth...');
            showNotification('Redirecting to Google...', 'info');
            
            // Check if Google OAuth is configured
            fetch('/auth/google/test')
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/auth/google';
                    } else {
                        showNotification('Google OAuth not configured. Please use email registration.', 'error');
                    }
                })
                .catch(error => {
                    console.error('❌ Google OAuth error:', error);
                    showNotification('Google OAuth not available. Please use email registration.', 'error');
                });
        }
        
        function signInWithGitHub() {
            console.log('🔐 Initiating GitHub OAuth...');
            showNotification('Redirecting to GitHub...', 'info');
            
            // Check if GitHub OAuth is configured
            fetch('/auth/github/test')
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/auth/github';
                    } else {
                        showNotification('GitHub OAuth not configured. Please use email registration.', 'error');
                    }
                })
                .catch(error => {
                    console.error('❌ GitHub OAuth error:', error);
                    showNotification('GitHub OAuth not available. Please use email registration.', 'error');
                });
        }
        
        // Check OAuth availability on page load
        window.addEventListener('load', function() {
            console.log('🔍 Checking OAuth availability...');
            
            // Test Google OAuth
            fetch('/auth/google/test')
                .then(response => {
                    if (response.ok) {
                        console.log('✅ Google OAuth is available');
                    } else {
                        console.log('❌ Google OAuth not configured');
                    }
                })
                .catch(error => {
                    console.log('❌ Google OAuth not available:', error.message);
                });
            
            // Test GitHub OAuth
            fetch('/auth/github/test')
                .then(response => {
                    if (response.ok) {
                        console.log('✅ GitHub OAuth is available');
                    } else {
                        console.log('❌ GitHub OAuth not configured');
                    }
                })
                .catch(error => {
                    console.log('❌ GitHub OAuth not available:', error.message);
                });
        });
    </script>
</body>
</html>
