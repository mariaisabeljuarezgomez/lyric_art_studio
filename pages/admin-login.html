<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Lyric Art Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <!-- Global Image Protection System - TEMPORARILY DISABLED FOR DEBUGGING -->
    <script src="../public/global-image-protection.js"></script>
    <style>
        .admin-login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--color-surface);
            border: 1px solid var(--color-border-subtle);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .admin-login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .admin-login-title {
            color: var(--color-accent);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .admin-login-subtitle {
            color: var(--color-text-secondary);
            font-size: 14px;
        }
        
        .admin-form-group {
            margin-bottom: 20px;
        }
        
        .admin-form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text-primary);
            font-weight: 600;
        }
        
        .admin-form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--color-border-subtle);
            border-radius: 8px;
            background: var(--color-background);
            color: var(--color-text-primary);
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .admin-form-input:focus {
            outline: none;
            border-color: var(--color-accent);
        }
        
        .admin-login-btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--color-accent);
            color: var(--color-background);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        
        .admin-login-btn:hover {
            opacity: 0.9;
        }
        
        .admin-login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .admin-error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .admin-success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .admin-loading {
            text-align: center;
            color: var(--color-text-secondary);
            display: none;
        }
        
        .admin-security-notice {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 6px;
            font-size: 12px;
            color: #856404;
        }
    </style>
</head>
<body class="bg-background text-text-primary font-inter">
    <div class="admin-login-container">
        <div class="admin-login-header">
            <div class="admin-login-title">🔐 Admin Access</div>
            <div class="admin-login-subtitle">Lyric Art Studio Administration</div>
        </div>
        
        <div id="admin-error" class="admin-error"></div>
        <div id="admin-success" class="admin-success"></div>
        <div id="admin-loading" class="admin-loading">Authenticating...</div>
        
        <form id="admin-login-form">
            <div class="admin-form-group">
                <label for="admin-username" class="admin-form-label">Username</label>
                <input 
                    type="text" 
                    id="admin-username" 
                    name="username" 
                    class="admin-form-input" 
                    required
                    autocomplete="username"
                >
            </div>
            
            <div class="admin-form-group">
                <label for="admin-password" class="admin-form-label">Password</label>
                <input 
                    type="password" 
                    id="admin-password" 
                    name="password" 
                    class="admin-form-input" 
                    required
                    autocomplete="current-password"
                >
            </div>
            
            <div class="admin-form-group">
                <label for="admin-otp" class="admin-form-label">2FA Code (if enabled)</label>
                <input 
                    type="text" 
                    id="admin-otp" 
                    name="otp" 
                    class="admin-form-input" 
                    placeholder="Enter 6-digit code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                >
            </div>
            
            <button type="submit" id="admin-login-btn" class="admin-login-btn">
                🔐 Login to Admin Panel
            </button>
        </form>
        
        <div class="admin-security-notice">
            <strong>🔒 Security Notice:</strong> This admin panel is protected by IP whitelisting, rate limiting, and session management. All access attempts are logged for security monitoring.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('admin-login-form');
            const errorDiv = document.getElementById('admin-error');
            const successDiv = document.getElementById('admin-success');
            const loadingDiv = document.getElementById('admin-loading');
            const loginBtn = document.getElementById('admin-login-btn');
            
            // Check if already logged in
            checkAdminSession();
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('admin-username').value;
                const password = document.getElementById('admin-password').value;
                const otp = document.getElementById('admin-otp').value;
                
                // Show loading
                showLoading(true);
                hideMessages();
                
                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            username: username,
                            password: password,
                            otp: otp || null
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        showSuccess('Login successful! Redirecting to admin dashboard...');
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard';
                        }, 1500);
                    } else {
                        showError(data.message || 'Login failed. Please check your credentials.');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('Network error. Please try again.');
                } finally {
                    showLoading(false);
                }
            });
            
            async function checkAdminSession() {
                try {
                    const response = await fetch('/api/admin/session', {
                        credentials: 'include'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.authenticated) {
                            window.location.href = '/admin/dashboard';
                        }
                    }
                } catch (error) {
                    console.error('Session check error:', error);
                }
            }
            
            function showLoading(show) {
                loadingDiv.style.display = show ? 'block' : 'none';
                loginBtn.disabled = show;
            }
            
            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
            
            function showSuccess(message) {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
            }
            
            function hideMessages() {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
