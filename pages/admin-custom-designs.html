<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Lyric Art Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Tab Navigation */
        .tab-navigation {
            display: flex;
            border-bottom: 2px solid var(--color-border-subtle);
            margin-bottom: 30px;
        }
        
        .tab-button {
            background: none;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-button.active {
            color: var(--color-accent);
            border-bottom-color: var(--color-accent);
        }
        
        .tab-button:hover {
            color: var(--color-accent);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .admin-title {
            margin: 0;
            color: var(--color-accent);
            font-size: 28px;
        }
        
        .admin-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .admin-key-input {
            padding: 8px 12px;
            border: 1px solid var(--color-border-subtle);
            border-radius: 4px;
            background: var(--color-surface);
            color: var(--color-text-primary);
        }
        
        .refresh-btn {
            background: var(--color-accent);
            color: var(--color-background);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .refresh-btn:hover {
            opacity: 0.9;
        }
        
        /* Custom Design Requests */
        .request-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border-subtle);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .request-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-pending { background: #fff3cd; color: #856404; }
        .status-in-progress { background: #d1ecf1; color: #0c5460; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        
        .request-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .lyrics-section {
            background: var(--color-background);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--color-border-subtle);
        }
        
        .lyrics-text {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            color: var(--color-text-primary);
        }
        
        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .status-select {
            padding: 8px 12px;
            border: 1px solid var(--color-border-subtle);
            border-radius: 4px;
            background: var(--color-surface);
            color: var(--color-text-primary);
        }
        
        .admin-notes {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--color-border-subtle);
            border-radius: 4px;
            background: var(--color-surface);
            color: var(--color-text-primary);
            resize: vertical;
            min-height: 80px;
        }
        
        /* Newsletter Subscribers */
        .subscribers-container {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid var(--color-border-subtle);
            border-radius: 8px;
            background: var(--color-surface);
        }
        
        .subscriber-card {
            padding: 15px 20px;
            border-bottom: 1px solid var(--color-border-subtle);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: center;
        }
        
        .subscriber-card:last-child {
            border-bottom: none;
        }
        
        .subscriber-card:hover {
            background: var(--color-background);
        }
        
        .subscriber-header {
            background: var(--color-accent);
            color: var(--color-background);
            padding: 15px 20px;
            font-weight: bold;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }
        
        .subscriber-email {
            font-weight: 600;
            color: var(--color-accent);
        }
        
        .subscriber-name {
            color: var(--color-text-primary);
        }
        
        .subscriber-ip {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--color-text-secondary);
        }
        
        .subscriber-date {
            font-size: 12px;
            color: var(--color-text-secondary);
        }
        
        .subscriber-status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }
        
        .status-active { background: #d4edda; color: #155724; }
        .status-inactive { background: #f8d7da; color: #721c24; }
        
        /* Empty States */
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--color-text-secondary);
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border-subtle);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--color-accent);
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--color-text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-background text-text-primary font-inter">
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <h1 class="admin-title">🎨 Lyric Art Studio Admin Dashboard</h1>
            <div class="admin-controls">
                <input 
                    type="password" 
                    id="admin-key-input" 
                    placeholder="Admin Key" 
                    value="lyric-admin-secure-2025"
                    class="admin-key-input"
                >
                <button class="refresh-btn" onclick="refreshAllData()">🔄 Refresh All</button>
            </div>
        </div>
        
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-button active" onclick="showTab('overview')">📊 Overview</button>
            <button class="tab-button" onclick="showTab('custom-designs')">🎨 Custom Designs</button>
            <button class="tab-button" onclick="showTab('subscribers')">📧 Newsletter Subscribers</button>
        </div>
        
        <!-- Overview Tab -->
        <div id="overview" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-subscribers">-</div>
                    <div class="stat-label">Total Subscribers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="active-subscribers">-</div>
                    <div class="stat-label">Active Subscribers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="total-design-requests">-</div>
                    <div class="stat-label">Design Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pending-requests">-</div>
                    <div class="stat-label">Pending Requests</div>
                </div>
            </div>
            
            <div style="text-align: center; color: var(--color-text-secondary);">
                <p>Select a tab above to view detailed information</p>
            </div>
        </div>
        
        <!-- Custom Design Requests Tab -->
        <div id="custom-designs" class="tab-content">
            <div id="requests-container">
                <div class="no-data">
                    <p>Loading custom design requests...</p>
                </div>
            </div>
        </div>
        
        <!-- Newsletter Subscribers Tab -->
        <div id="subscribers" class="tab-content">
            <div id="subscribers-container">
                <div class="no-data">
                    <p>Loading newsletter subscribers...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadOverviewData();
            loadCustomDesignRequests();
            loadNewsletterSubscribers();
        });

        // Tab functionality
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all buttons
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
        }

        // Refresh all data
        function refreshAllData() {
            loadOverviewData();
            loadCustomDesignRequests();
            loadNewsletterSubscribers();
        }

        // Load overview statistics
        async function loadOverviewData() {
            try {
                const adminKey = document.getElementById('admin-key-input').value;
                
                // Load subscribers count
                const subscribersResponse = await fetch(`/api/admin/newsletter-subscribers?adminKey=${adminKey}`, {
                    credentials: 'include'
                });
                
                if (subscribersResponse.ok) {
                    const subscribersData = await subscribersResponse.json();
                    const totalSubscribers = subscribersData.subscribers.length;
                    const activeSubscribers = subscribersData.subscribers.filter(s => s.status === 'active').length;
                    
                    document.getElementById('total-subscribers').textContent = totalSubscribers;
                    document.getElementById('active-subscribers').textContent = activeSubscribers;
                }
                
                // Load design requests count
                const requestsResponse = await fetch(`/api/admin/custom-designs?adminKey=${adminKey}`, {
                    credentials: 'include'
                });
                
                if (requestsResponse.ok) {
                    const requestsData = await requestsResponse.json();
                    const totalRequests = requestsData.requests.length;
                    const pendingRequests = requestsData.requests.filter(r => r.status === 'pending').length;
                    
                    document.getElementById('total-design-requests').textContent = totalRequests;
                    document.getElementById('pending-requests').textContent = pendingRequests;
                }
            } catch (error) {
                console.error('Error loading overview data:', error);
            }
        }

        // Load custom design requests
        async function loadCustomDesignRequests() {
            try {
                const adminKey = document.getElementById('admin-key-input').value;
                console.log('🔍 Loading custom design requests with admin key:', adminKey);
                console.log('🔍 Making request to:', `/api/admin/custom-designs?adminKey=${adminKey}`);
                
                const response = await fetch(`/api/admin/custom-designs?adminKey=${adminKey}`, {
                    credentials: 'include'
                });
                
                console.log('🔍 Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Response not OK:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('✅ Received data:', data);
                displayCustomDesignRequests(data.requests);
            } catch (error) {
                console.error('❌ Error loading custom design requests:', error);
                document.getElementById('requests-container').innerHTML = `
                    <div class="no-data">
                        <p>Error loading custom design requests: ${error.message}</p>
                        <p>Please check the browser console for more details.</p>
                    </div>
                `;
            }
        }

        // Load newsletter subscribers
        async function loadNewsletterSubscribers() {
            try {
                const adminKey = document.getElementById('admin-key-input').value;
                console.log('📧 Loading newsletter subscribers with admin key:', adminKey);
                
                const response = await fetch(`/api/admin/newsletter-subscribers?adminKey=${adminKey}`, {
                    credentials: 'include'
                });
                
                console.log('📧 Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Response not OK:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('✅ Received subscribers data:', data);
                displayNewsletterSubscribers(data.subscribers);
            } catch (error) {
                console.error('❌ Error loading newsletter subscribers:', error);
                document.getElementById('subscribers-container').innerHTML = `
                    <div class="no-data">
                        <p>Error loading newsletter subscribers: ${error.message}</p>
                        <p>Please check the browser console for more details.</p>
                    </div>
                `;
            }
        }

        // Display custom design requests
        function displayCustomDesignRequests(requests) {
            console.log('🎨 Displaying custom design requests:', requests);
            const container = document.getElementById('requests-container');
            
            if (!requests || requests.length === 0) {
                console.log('📭 No requests to display');
                container.innerHTML = `
                    <div class="no-data">
                        <p>No custom design requests found.</p>
                    </div>
                `;
                return;
            }
            
            console.log(`📊 Displaying ${requests.length} requests`);
            
            container.innerHTML = requests.map(request => `
                <div class="request-card">
                    <div class="request-header">
                        <div>
                            <h3 style="margin: 0; color: var(--color-accent);">${request.artist_name} - ${request.song_title}</h3>
                            <p style="margin: 5px 0 0 0; color: var(--color-text-secondary);">
                                Requested by: ${request.user_email} | ${new Date(request.created_at).toLocaleString()}
                            </p>
                        </div>
                        <div>
                            <span class="request-status status-${request.status}">${request.status.toUpperCase()}</span>
                            <p style="margin: 5px 0 0 0; text-align: right; color: var(--color-accent); font-weight: bold;">
                                $${request.price}
                            </p>
                        </div>
                    </div>
                    
                    <div class="request-details">
                        <div>
                            <p><strong>Design Style:</strong> ${request.design_style}</p>
                            <p><strong>Additional Notes:</strong> ${request.additional_notes || 'None'}</p>
                            <p><strong>Admin Notes:</strong> ${request.admin_notes || 'None'}</p>
                        </div>
                        <div class="lyrics-section">
                            <h4 style="margin: 0 0 10px 0; color: var(--color-accent);">📝 Lyrics:</h4>
                            <div class="lyrics-text">${request.lyrics}</div>
                        </div>
                    </div>
                    
                    <div class="admin-actions">
                        <select class="status-select" id="status-${request.id}" onchange="updateRequestStatus(${request.id})">
                            <option value="pending" ${request.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="in-progress" ${request.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                            <option value="completed" ${request.status === 'completed' ? 'selected' : ''}>Completed</option>
                            <option value="cancelled" ${request.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                        <textarea 
                            class="admin-notes" 
                            id="notes-${request.id}" 
                            placeholder="Add admin notes..."
                            onblur="updateRequestStatus(${request.id})"
                        >${request.admin_notes || ''}</textarea>
                    </div>
                </div>
            `).join('');
        }

        // Display newsletter subscribers
        function displayNewsletterSubscribers(subscribers) {
            console.log('📧 Displaying newsletter subscribers:', subscribers);
            const container = document.getElementById('subscribers-container');
            
            if (!subscribers || subscribers.length === 0) {
                console.log('📭 No subscribers to display');
                container.innerHTML = `
                    <div class="no-data">
                        <p>No newsletter subscribers found.</p>
                    </div>
                `;
                return;
            }
            
            console.log(`📊 Displaying ${subscribers.length} subscribers`);
            
            container.innerHTML = `
                <div class="subscriber-header">
                    <div>Email</div>
                    <div>Name</div>
                    <div>IP Address</div>
                    <div>Subscribed Date</div>
                    <div>Status</div>
                </div>
                ${subscribers.map(subscriber => `
                    <div class="subscriber-card">
                        <div class="subscriber-email">${subscriber.email}</div>
                        <div class="subscriber-name">${subscriber.name || 'Not provided'}</div>
                        <div class="subscriber-ip">${subscriber.ip_address || 'Unknown'}</div>
                        <div class="subscriber-date">${new Date(subscriber.subscribed_at).toLocaleDateString()}</div>
                        <div class="subscriber-status status-${subscriber.status}">${subscriber.status.toUpperCase()}</div>
                    </div>
                `).join('')}
            `;
        }

        // Update request status
        async function updateRequestStatus(requestId) {
            try {
                const status = document.getElementById(`status-${requestId}`).value;
                const notes = document.getElementById(`notes-${requestId}`).value;
                const adminKey = document.getElementById('admin-key-input').value;
                
                const response = await fetch(`/api/admin/custom-designs/${requestId}?adminKey=${adminKey}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        status: status,
                        admin_notes: notes
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to update request status');
                }
                
                console.log('Request status updated successfully');
            } catch (error) {
                console.error('Error updating request status:', error);
                alert('Failed to update request status. Please try again.');
            }
        }
    </script>
</body>
</html>
